<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AZ Cast & Crew Call Generator</title>

  <!-- PWA & Mobile App Meta Tags -->
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AZ Cast & Crew">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 30px 16px 60px;
      -webkit-tap-highlight-color: transparent;
    }

    .app-container {
      width: 100%;
      max-width: 640px;
    }

    /* Header */
    .header-box {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-box h1 {
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .header-box p {
      font-size: 14px;
      color: #94A3B8;
    }

    /* Main Form Box */
    .form-wrapper {
      background-color: #1E293B;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 520px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #CBD5E1;
      margin-bottom: 6px;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      background-color: #0F172A;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #FFFFFF;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      border-color: #38BDF8;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* Buttons / Selectors */
    .btn-group {
      display: flex;
      gap: 8px;
    }

    .toggle-btn {
      flex: 1;
      background-color: #0F172A;
      border: 1px solid #334155;
      color: #94A3B8;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background-color: #38BDF8;
      border-color: #38BDF8;
      color: #0F172A;
    }

    .submit-btn {
      width: 100%;
      background-color: #38BDF8;
      color: #0F172A;
      border: none;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    .submit-btn:hover {
      background-color: #0EA5E9;
    }

    .error-msg {
      display: none;
      color: #F87171;
      font-size: 13px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .error-msg.show {
      display: block;
    }

    /* Output Card / Ticket */
    #ticket {
      display: none;
      background-color: #1E293B;
      border: 1px solid #38BDF8;
      border-radius: 12px;
      padding: 20px;
    }

    #ticket.show {
      display: block;
    }

    .ticket-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .ticket-title {
      font-size: 14px;
      font-weight: 700;
      color: #38BDF8;
    }

    .copy-btn {
      background-color: #38BDF8;
      color: #0F172A;
      border: none;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }

    .copy-btn.copied {
      background-color: #34D399;
      color: #064E3B;
    }

    #ticketText {
      background-color: #0F172A;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 14px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;
      color: #E2E8F0;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <div class="header-box">
      <h1>AZ Cast & Crew Call Generator</h1>
      <p>Standardized plain-text cast and crew call creator</p>
    </div>

    <div class="form-wrapper">
      <div id="formError" class="error-msg">⚠️ Please fill in all required fields and choose Pay & Craft options.</div>

      <form id="callForm">
        
        <div class="grid-2">
          <div class="form-group">
            <label for="postType">Post Type *</label>
            <select id="postType" required>
              <option value="Cast & Crew Call" selected>Cast & Crew Call</option>
              <option value="Casting Call">Casting Call</option>
              <option value="Crew Call">Crew Call</option>
            </select>
          </div>
          <div class="form-group">
            <label for="projectType">Project Format *</label>
            <select id="projectType" required>
              <option value="Short Film" selected>Short Film</option>
              <option value="Feature Film">Feature Film</option>
              <option value="Documentary">Documentary</option>
              <option value="Commercial">Commercial</option>
              <option value="Music Video">Music Video</option>
              <option value="Web Series">Web Series</option>
              <option value="Student Film">Student Film</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="projectTitle">Project Title *</label>
            <input type="text" id="projectTitle" placeholder="Project Name" required>
          </div>
          <div class="form-group">
            <label for="unionStatus">Union Status *</label>
            <select id="unionStatus" required>
              <option value="Non-Union" selected>Non-Union</option>
              <option value="SAG-AFTRA Micro-Budget">SAG-AFTRA Micro-Budget</option>
              <option value="SAG-AFTRA Short Project">SAG-AFTRA Short Project</option>
              <option value="SAG-AFTRA Modified Low Budget">SAG-AFTRA Modified Low Budget</option>
              <option value="SAG-AFTRA Theatrical">SAG-AFTRA Theatrical</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="city">City / Region *</label>
            <input type="text" id="city" placeholder="e.g. Phoenix, AZ / Tucson, AZ" required>
          </div>
          <div class="form-group">
            <label for="locationDetail">Location Specifics</label>
            <input type="text" id="locationDetail" placeholder="e.g. Studio / On Location">
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="shootDate">Shoot Date(s) *</label>
            <input type="text" id="shootDate" placeholder="e.g. Oct 12-14" required>
          </div>
          <div class="form-group">
            <label for="callTime">Call Time *</label>
            <input type="text" id="callTime" placeholder="e.g. 7:00 AM / TBD" required>
          </div>
        </div>

        <div class="form-group">
          <label for="duration">Estimated Day Length *</label>
          <input type="text" id="duration" placeholder="e.g. 10-Hour Day / Half Day" required>
        </div>

        <!-- Compensation Toggle -->
        <div class="form-group">
          <label>Compensation *</label>
          <div class="btn-group">
            <button type="button" id="btnPaid" class="toggle-btn active" onclick="setPay('paid')">Paid</button>
            <button type="button" id="btnUnpaid" class="toggle-btn" onclick="setPay('unpaid')">Unpaid</button>
          </div>
        </div>

        <div id="rateGroup" class="form-group">
          <label for="rate">Rate Details *</label>
          <input type="text" id="rate" placeholder="e.g. $250/day or Scale">
        </div>

        <div id="otherCompGroup" class="form-group" style="display: none;">
          <label for="otherComp">Other Compensation *</label>
          <input type="text" id="otherComp" placeholder="e.g. Meals, Copy, Credit, Gas">
        </div>

        <!-- Craft Services Toggle -->
        <div class="form-group">
          <label>Craft Services / Meals *</label>
          <div class="btn-group">
            <button type="button" id="btnCraftYes" class="toggle-btn active" onclick="setCraft('Full Meals Provided')">Meals Provided</button>
            <button type="button" id="btnCraftSnacks" class="toggle-btn" onclick="setCraft('Snacks & Water Provided')">Snacks Only</button>
            <button type="button" id="btnCraftNo" class="toggle-btn" onclick="setCraft('None / Self-Provided')">None</button>
          </div>
        </div>

        <div class="form-group">
          <label for="roleNeeded">Roles & Positions Needed *</label>
          <textarea id="roleNeeded" placeholder="[ROLES]&#10;• Character Name (Age range, description)&#10;• Crew Position (Department)" required></textarea>
        </div>

        <div class="form-group">
          <label for="extra">Additional Details / Logline</label>
          <textarea id="extra" placeholder="Brief project summary, guidelines, or requirements..."></textarea>
        </div>

        <div class="form-group">
          <label for="contact">How to Apply / Contact *</label>
          <input type="text" id="contact" placeholder="e.g. email@example.com" required>
        </div>

        <button type="submit" class="submit-btn">Generate Cast & Crew Call</button>
      </form>
    </div>

    <!-- Output Box -->
    <div id="ticket">
      <div class="ticket-header">
        <span class="ticket-title">Plain-Text Output</span>
        <button id="copyBtn" class="copy-btn">Copy Post Text</button>
      </div>
      <div id="ticketText"></div>
    </div>

  </div>

  <script>
    let payStatus = 'paid';
    let craftStatus = 'Full Meals Provided';

    function setPay(status) {
      payStatus = status;
      document.getElementById('btnPaid').classList.toggle('active', status === 'paid');
      document.getElementById('btnUnpaid').classList.toggle('active', status === 'unpaid');
      document.getElementById('rateGroup').style.display = status === 'paid' ? 'block' : 'none';
      document.getElementById('otherCompGroup').style.display = status === 'unpaid' ? 'block' : 'none';
    }

    function setCraft(status) {
      craftStatus = status;
      document.getElementById('btnCraftYes').classList.toggle('active', status === 'Full Meals Provided');
      document.getElementById('btnCraftSnacks').classList.toggle('active', status === 'Snacks & Water Provided');
      document.getElementById('btnCraftNo').classList.toggle('active', status === 'None / Self-Provided');
    }

    // Form Submission
    document.getElementById('callForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById('formError');

      if (!form.checkValidity() || !payStatus || !craftStatus) {
        form.reportValidity();
        errorEl.classList.add('show');
        return;
      }
      errorEl.classList.remove('show');

      const val = id => document.getElementById(id).value.trim();

      const payLine = payStatus === 'paid'
        ? `Compensation: Paid (${val('rate') || 'Rate Negotiable'})`
        : `Compensation: Unpaid (Other compensation: ${val('otherComp') || 'Copy, Credit, Meals'})`;

      const lines = [
        `${val('postType').toUpperCase()}: ${val('projectTitle')} (${val('projectType')})`,
        `\n[ PRODUCTION DETAILS ]`,
        `Location: ${val('city')}${val('locationDetail') ? ' — ' + val('locationDetail') : ''}`,
        `Date(s): ${val('shootDate')}`,
        `Call Time: ${val('callTime')}`,
        `Estimated Day Length: ${val('duration')}`,
        `Union Status: ${val('unionStatus')}`,
        payLine,
        `Craft Services: ${craftStatus}`,
        `How to Apply: ${val('contact')}`,
        `\n[ ROLES & POSITIONS ]`,
        val('roleNeeded')
      ];

      if (val('extra')) {
        lines.push(`\n[ ADDITIONAL DETAILS ]`, val('extra'));
      }

      lines.push(`\n— posted via AZ Cast & Crew Call Generator`);

      const output = lines.join('\n');
      document.getElementById('ticketText').textContent = output;
      document.getElementById('ticket').classList.add('show');
      document.getElementById('ticket').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    // Copy Action
    document.getElementById('copyBtn').addEventListener('click', () => {
      const text = document.getElementById('ticketText').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied ✓';
        btn.classList.add('copied');
        setTimeout(() => { 
          btn.textContent = 'Copy Post Text'; 
          btn.classList.remove('copied'); 
        }, 2000);
      });
    });

    // Service Worker Registration for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>

</body>
</html>
